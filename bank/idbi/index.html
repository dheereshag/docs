<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Statement - Indian Bank</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      @page {
        size: A4 portrait;
        margin: 0;
      }
    </style>
  </head>
  <body
    class="flex flex-col items-center bg-[#e2e4e8] px-5 py-10 font-sans text-[#111] antialiased print:m-0 print:h-full print:w-[210mm] print:bg-transparent print:p-0"
  >
    <div id="pages-container"></div>

    <script type="module">
      import { BANK_CONFIG } from "../../data/config.js";

      function formatINR(val) {
        return (
          "INR " +
          Number(val).toLocaleString("en-IN", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2,
          })
        );
      }

      function renderStatement(data) {
        const container = document.getElementById("pages-container");
        container.innerHTML = "";

        let runningBalance = data.openingBalance;
        let totalDebits = 0;
        let totalCredits = 0;

        const processedTransactions = data.transactions.map((txn) => {
          totalDebits += txn.debit || 0;
          totalCredits += txn.credit || 0;
          runningBalance = runningBalance + (txn.credit || 0) - (txn.debit || 0);
          return {
            ...txn,
            balance: runningBalance,
          };
        });

        const endingBalance = runningBalance;
        const page1Txns = processedTransactions.slice(0, data.page1ItemCount || 6);
        const page2Txns = processedTransactions.slice(data.page1ItemCount || 6);

        // Helper to generate transaction rows HTML
        function generateRowsHTML(txns) {
          return txns
            .map(
              (t) => `
          <tr>
            <td class="col-date w-[17%] whitespace-nowrap border-b border-[#888] px-1 py-3.25 align-top text-[11.5px] leading-[1.36] text-[#111]">${t.date}</td>
            <td class="col-details w-[43%] wrap-break-word border-b border-[#888] px-1 py-3.25 align-top text-[11.5px] leading-[1.36] text-[#111]">${t.details.replace(/\n/g, "<br>")}</td>
            <td class="col-debit w-[14%] whitespace-nowrap border-b border-[#888] px-1 py-3.25 align-top text-center text-[11.5px] leading-[1.36] text-[#111]">${t.debit > 0 ? formatINR(t.debit) : "-"}</td>
            <td class="col-credit w-[12%] whitespace-nowrap border-b border-[#888] px-1 py-3.25 align-top text-center text-[11.5px] leading-[1.36] text-[#111]">${t.credit > 0 ? formatINR(t.credit) : "-"}</td>
            <td class="col-balance w-[14%] whitespace-nowrap border-b border-[#888] px-1 py-3.25 align-top text-right text-[11.5px] leading-[1.36] text-[#111]">${formatINR(t.balance)}</td>
          </tr>
        `,
            )
            .join("");
        }

        // --- PAGE 1 ---
        const page1 = document.createElement("div");
        page1.className =
          "statement-page relative mb-10 flex min-h-280.5 w-full max-w-198.5 flex-col justify-between overflow-hidden bg-white px-12 pb-6 pt-10 shadow-[0_8px_30px_rgba(0,0,0,0.08)] print:m-0 print:h-[296.5mm] print:min-h-[296.5mm] print:max-h-[297mm] print:w-[210mm] print:box-border print:p-[38px_46px_24px_46px] print:shadow-none print:break-after-page";
        page1.innerHTML = `
        <img src="./watermark.jpg" alt="Watermark" class="watermark-page1 pointer-events-none absolute top-1/2 left-1/2 z-1 h-auto w-130 -translate-x-1/2 -translate-y-1/2 opacity-95 print:[print-color-adjust:exact]">

        <div class="content-layer relative z-2">
          <div class="header-top mb-9 grid grid-cols-[180px_1fr_180px] items-center">
            <img src="./logo.jpg" alt="Indian Bank" class="bank-logo h-11 w-auto object-contain">
            <div class="header-title whitespace-nowrap text-center text-[21px] font-bold tracking-[0.02em] text-[#222] uppercase">ACCOUNT STATEMENT</div>
            <div></div>
          </div>

          <div class="header-subtitle-container mb-8.5 text-center">
            <div class="header-subtitle text-[13px] font-normal text-[#222]">Last ${data.transactions.length} Transactions</div>
          </div>

          <div class="details-grid mb-7 grid grid-cols-2 gap-x-9">
            <div>
              <div class="section-title mb-3.5 text-[13.5px] font-bold text-black uppercase">ACCOUNT DETAILS</div>
              <table class="info-table details-table w-full border-collapse text-[11.5px]">
                <tr>
                  <td class="label w-[44%] py-[3.5px] align-top leading-[1.4] font-normal text-[#222]">Account Holder Name</td>
                  <td class="val bold-val w-[56%] py-[3.5px] align-top leading-[1.4] pl-1.5 text-left font-bold text-[#111]">${data.accountDetails.name}</td>
                </tr>
                <tr>
                  <td class="label w-[44%] py-[3.5px] align-top leading-[1.4] font-normal text-[#222]">Account Type</td>
                  <td class="val w-[56%] py-[3.5px] align-top leading-[1.4] pl-1.5 text-left font-normal text-[#111]">${data.accountDetails.type}</td>
                </tr>
                <tr>
                  <td class="label w-[44%] py-[3.5px] align-top leading-[1.4] font-normal text-[#222]">Account Number</td>
                  <td class="val w-[56%] py-[3.5px] align-top leading-[1.4] pl-1.5 text-left font-normal text-[#111]">${data.accountDetails.number}</td>
                </tr>
                <tr>
                  <td class="label w-[44%] py-[3.5px] align-top leading-[1.4] font-normal text-[#222]">Customer's Address</td>
                  <td class="val address-val w-[56%] py-[3.5px] align-top pl-1.5 text-left leading-[1.35] font-normal text-[#111]">${data.accountDetails.address.replace(/\n/g, "<br>")}</td>
                </tr>
                <tr>
                  <td class="label w-[44%] py-[3.5px] align-top leading-[1.4] font-normal text-[#222]">Branch Name</td>
                  <td class="val w-[56%] py-[3.5px] align-top leading-[1.4] pl-1.5 text-left font-normal text-[#111]">${data.accountDetails.branch}</td>
                </tr>
                <tr>
                  <td class="label w-[44%] py-[3.5px] align-top leading-[1.4] font-normal text-[#222]">IFSC</td>
                  <td class="val w-[56%] py-[3.5px] align-top leading-[1.4] pl-1.5 text-left font-normal text-[#111]">${data.accountDetails.ifsc}</td>
                </tr>
                <tr>
                  <td class="label w-[44%] py-[3.5px] align-top leading-[1.4] font-normal text-[#222]">Account Currency</td>
                  <td class="val w-[56%] py-[3.5px] align-top leading-[1.4] pl-1.5 text-left font-normal text-[#111]">${data.accountDetails.currency}</td>
                </tr>
              </table>
            </div>

            <div>
              <div class="section-title summary-title mb-3.5 border-b-[1.5px] border-black pb-1 text-[13.5px] font-bold text-black uppercase">ACCOUNT SUMMARY</div>
              <table class="info-table summary-table w-full border-collapse text-[11.5px]">
                <tr>
                  <td class="label w-1/2 py-[3.5px] align-top leading-[1.4] font-normal text-[#222]">Opening Balance</td>
                  <td class="val w-1/2 py-[3.5px] align-top leading-[1.4] font-normal text-[#111] text-right">${formatINR(data.openingBalance)}</td>
                </tr>
                <tr>
                  <td class="label w-1/2 py-[3.5px] align-top leading-[1.4] font-normal text-[#222]">Total Credits</td>
                  <td class="val w-1/2 py-[3.5px] align-top leading-[1.4] font-normal text-[#111] text-right">+ ${formatINR(totalCredits)}</td>
                </tr>
                <tr>
                  <td class="label w-1/2 py-[3.5px] align-top leading-[1.4] font-normal text-[#222]">Total Debits</td>
                  <td class="val w-1/2 py-[3.5px] align-top leading-[1.4] font-normal text-[#111] text-right">- ${formatINR(totalDebits)}</td>
                </tr>
                <tr style="height: 20px;"><td></td><td></td></tr>
                <tr>
                  <td class="label bold-val w-1/2 py-[3.5px] align-top leading-[1.4] font-bold text-[#222]">Ending Balance</td>
                  <td class="val bold-val w-1/2 py-[3.5px] align-top leading-[1.4] font-bold text-[#111] text-right">${formatINR(endingBalance)}</td>
                </tr>
              </table>
            </div>
          </div>

          <div class="activity-section mt-3.5">
            <div class="section-title mb-3.5 text-[13.5px] font-bold text-black uppercase">ACCOUNT ACTIVITY</div>
            <table class="activity-table mt-2.5 w-full border-collapse">
              <thead>
                <tr>
                  <th class="col-date w-[17%] border-y border-[#777] px-1 py-2.5 text-left text-[12.5px] font-bold text-[#111]">Date</th>
                  <th class="col-details w-[43%] border-y border-[#777] px-1 py-2.5 text-left text-[12.5px] font-bold text-[#111]">Transaction Details</th>
                  <th class="col-debit w-[14%] border-y border-[#777] px-1 py-2.5 text-center text-[12.5px] font-bold text-[#111]">Debits</th>
                  <th class="col-credit w-[12%] border-y border-[#777] px-1 py-2.5 text-center text-[12.5px] font-bold text-[#111]">Credits</th>
                  <th class="col-balance w-[14%] border-y border-[#777] px-1 py-2.5 text-right text-[12.5px] font-bold text-[#111]">Balance</th>
                </tr>
              </thead>
              <tbody>
                ${generateRowsHTML(page1Txns)}
              </tbody>
            </table>
          </div>
        </div>

        <div class="page-footer relative z-2 mt-auto flex items-center justify-between pt-4 text-[9.5px] text-[#555]">
          <div>Indian Bank | |</div>
          <div>1/2</div>
        </div>
      `;
        container.appendChild(page1);

        // --- PAGE 2 ---
        const page2 = document.createElement("div");
        page2.className =
          "statement-page relative mb-10 flex min-h-280.5 w-full max-w-198.5 flex-col justify-between overflow-hidden bg-white px-12 pb-6 pt-10 shadow-[0_8px_30px_rgba(0,0,0,0.08)] print:m-0 print:h-[296.5mm] print:min-h-[296.5mm] print:max-h-[297mm] print:w-[210mm] print:box-border print:p-[38px_46px_24px_46px] print:shadow-none print:break-after-auto";
        page2.innerHTML = `
        <img src="./watermark.jpg" alt="Watermark" class="watermark-page2 pointer-events-none absolute top-[55%] left-1/2 z-1 h-auto w-130 -translate-x-1/2 -translate-y-1/2 opacity-95 print:[print-color-adjust:exact]">

        <div class="content-layer relative z-2">
          <div class="activity-section mt-0">
            <table class="activity-table mt-2.5 w-full border-collapse">
              <thead>
                <tr>
                  <th class="col-date w-[17%] border-y border-[#777] px-1 py-2.5 text-left text-[12.5px] font-bold text-[#111]">Date</th>
                  <th class="col-details w-[43%] border-y border-[#777] px-1 py-2.5 text-left text-[12.5px] font-bold text-[#111]">Transaction Details</th>
                  <th class="col-debit w-[14%] border-y border-[#777] px-1 py-2.5 text-center text-[12.5px] font-bold text-[#111]">Debits</th>
                  <th class="col-credit w-[12%] border-y border-[#777] px-1 py-2.5 text-center text-[12.5px] font-bold text-[#111]">Credits</th>
                  <th class="col-balance w-[14%] border-y border-[#777] px-1 py-2.5 text-right text-[12.5px] font-bold text-[#111]">Balance</th>
                </tr>
              </thead>
              <tbody>
                ${generateRowsHTML(page2Txns)}
                <tr class="summary-row">
                  <td colspan="2" class="border-0 px-1 pb-2.5 pt-4 text-[12.5px] font-bold">Ending Balance</td>
                  <td class="border-0 px-1 pb-2.5 pt-4 text-[12.5px] font-bold"></td>
                  <td class="border-0 px-1 pb-2.5 pt-4 text-[12.5px] font-bold"></td>
                  <td class="col-balance border-0 px-1 pb-2.5 pt-4 text-right text-[12.5px] font-bold">${formatINR(endingBalance)}</td>
                </tr>
                <tr class="total-row">
                  <td colspan="2" class="border-y-[1.5px] border-black px-1 py-3 text-[12.5px] font-bold">Total</td>
                  <td class="col-debit border-y-[1.5px] border-black px-1 py-3 text-center text-[12.5px] font-bold">${formatINR(totalDebits)}</td>
                  <td class="col-credit border-y-[1.5px] border-black px-1 py-3 text-center text-[12.5px] font-bold">${formatINR(totalCredits)}</td>
                  <td class="border-y-[1.5px] border-black px-1 py-3 text-[12.5px] font-bold"></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="page-footer relative z-2 mt-auto flex items-center justify-between pt-4 text-[9.5px] text-[#555]">
          <div>Indian Bank | |</div>
          <div>2/2</div>
        </div>
      `;
        container.appendChild(page2);
      }

      // Run render
      renderStatement(window.BANK_CONFIG || BANK_CONFIG);
    </script>
  </body>
</html>
