<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Certificate Visual Comparison Tool</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #1e1e24;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 16px;
        border-bottom: 1px solid #333;
        margin-bottom: 16px;
      }
      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
      }
      .badges {
        display: flex;
        gap: 10px;
      }
      .badge {
        background: #2c2d35;
        padding: 4px 10px;
        border-radius: 4px;
        font-size: 13px;
        color: #8be9fd;
        border: 1px solid #44475a;
      }
      .comparison-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        width: 100%;
        max-width: 1900px;
        margin: 0 auto;
      }
      .panel {
        background: #282a36;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid #44475a;
        display: flex;
        flex-direction: column;
      }
      .panel-header {
        background: #191a21;
        padding: 10px 16px;
        font-weight: 600;
        font-size: 14px;
        border-bottom: 1px solid #44475a;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .panel-content {
        display: flex;
        justify-content: center;
        background: #505464;
        padding: 16px;
        overflow: auto;
      }
      .original-img {
        width: 100%;
        max-width: 794px;
        height: auto;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        background: #fff;
      }
      iframe {
        width: 210mm;
        height: 297mm;
        border: none;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        transform-origin: top center;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Verification: Original certificate.jpg vs Generated index.html</h1>
      <div class="badges">
        <span class="badge">A4 Portrait (210mm x 297mm)</span>
        <span class="badge">SSOT: config.js</span>
      </div>
    </header>

    <div class="comparison-container">
      <div class="panel">
        <div class="panel-header">
          <span>ORIGINAL CERTIFICATE (certificate.jpg)</span>
          <span style="color: #ffb86c">Reference Asset</span>
        </div>
        <div class="panel-content">
          <img
            src="certificate.jpg"
            alt="Original Certificate"
            class="original-img"
            id="orig-img"
          />
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <span>GENERATED HTML (index.html)</span>
          <span style="color: #50fa7b">Live Render</span>
        </div>
        <div class="panel-content">
          <iframe src="index.html" id="gen-frame" title="Generated Certificate"></iframe>
        </div>
      </div>
    </div>
  </body>
</html>
